name: CodSpeed
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  benchmarks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest==9.1.1 pytest-codspeed==5.0.3
      - uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: pytest tests/ --codspeed